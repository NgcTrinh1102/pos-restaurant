<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Xiaoyu POS{% endblock %} | Xiaoyu Vietnam POS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'order_create' %}">Xiaoyu Vietnam POS</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="{% url 'order_create' %}">Tạo đơn</a>
        <a class="nav-link" href="{% url 'product_list' %}">Thực đơn</a>
        {% if perms.pos.view_transaction %}
        <a class="nav-link" href="{% url 'revenue_report' %}">Báo cáo</a>
        {% endif %}
        {% if user.is_staff %}
        <a class="nav-link" href="/admin/">Quản trị</a>
        {% endif %}
      </div>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 mb-0">
        {% csrf_token %}
        <span class="text-light small">{{ user.username }}</span>
        <button type="submit" class="btn btn-sm btn-outline-light">Đăng xuất</button>
      </form>
      {% endif %}
    </div>
  </nav>

  <div class="container pb-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
