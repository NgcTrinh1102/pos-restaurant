<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Xiaoyu Vietnam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --orange: #ff7a00; --orange-dark: #e56d00; --peach: #fdeee2; --ink: #1b1b1b; --muted: #8b8b8b; }
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, sans-serif; color: var(--ink); margin: 0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--peach); padding: 24px;
    }
    .card {
      background: #fff; border-radius: 18px; padding: 36px 34px; width: 100%; max-width: 410px;
      box-shadow: 0 10px 34px rgba(0,0,0,.12); text-align: center;
    }
    .logo {
      width: 68px; height: 68px; border-radius: 50%; background: var(--orange); color: #fff;
      font-size: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
    }
    h1 { font-size: 26px; font-weight: 700; margin: 0; }
    h1 span { color: var(--orange); }
    .sub { color: var(--muted); font-size: 14px; margin: 4px 0 22px; }
    .field { text-align: left; margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .field input {
      width: 100%; border: 1.5px solid #cfcfcf; border-radius: 999px;
      padding: 11px 18px; font-size: 15px; outline: none;
    }
    .field input:focus { border-color: var(--orange); }
    .btn {
      width: 100%; background: var(--orange); color: #fff; border: 0; border-radius: 999px;
      padding: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px;
    }
    .btn:hover { background: var(--orange-dark); }
    .err {
      background: #fdecec; border: 1px solid #f5b5b5; color: #b32020; border-radius: 10px;
      padding: 9px 12px; font-size: 14px; margin-bottom: 14px; text-align: left;
    }
    .foot { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><i class="bi bi-fire"></i></div>
    <h1>Xiaoyu <span>Vietnam</span></h1>
    <p class="sub">Hệ thống quản lý bán hàng</p>

    {% if form.errors %}
    <div class="err">Tên đăng nhập hoặc mật khẩu chưa đúng. Vui lòng thử lại.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="id_username">Tên đăng nhập</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username" required>
      </div>
      <div class="field">
        <label for="id_password">Mật khẩu</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Đăng nhập</button>
    </form>
    <div class="foot">© Xiaoyu Vietnam</div>
  </div>
</body>
</html>
